<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ม้าแข่งจับสลาก</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1d2433;--muted:#6b7385;--accent:#e8512f;--line:#dfe3ee}
@media (prefers-color-scheme:dark){:root{--bg:#14171f;--card:#1e222c;--text:#eef0f6;--muted:#9aa2b5;--accent:#ff7a59;--line:#333a4a}}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;background:var(--bg);color:var(--text);padding:16px}
.wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
h1{grid-column:1/-1;text-align:center;margin:6px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
canvas#cv{width:100%;height:auto;display:block;border-radius:10px}
.banner{text-align:center;font-size:clamp(22px,4vw,36px);font-weight:800;min-height:56px;padding:8px;margin-bottom:8px;border-radius:10px;background:var(--bg);word-break:break-word}
.banner.win{color:var(--accent)}
button{padding:12px 20px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer;width:100%}
button.sec{background:var(--line);color:var(--text)}
button:disabled{opacity:.5;cursor:not-allowed}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 6px}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
textarea{height:240px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
h3{margin:14px 0 0}
ol{padding-left:0;margin:8px 0 0;list-style:none}
li{padding:6px 0;border-bottom:1px dashed var(--line)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="wrap">
  <h1>🐎 ม้าแข่งจับสลาก</h1>

  <div class="card">
    <div class="banner" id="banner">พร้อมแข่ง — กด "เริ่มแข่ง"</div>
    <canvas id="cv" width="1000" height="700"></canvas>
  </div>

  <div class="card">
    <label for="names" style="margin-top:0">รายชื่อผู้เข้าแข่ง (บรรทัดละ 1 คน, สูงสุด 30)</label>
    <textarea id="names"></textarea>
    <label for="prizes">จำนวนรางวัล (ผู้ที่เข้าเส้นชัย N อันดับแรก)</label>
    <input id="prizes" type="number" min="1" value="3">
    <div class="two">
      <button id="go">🏁 เริ่มแข่ง</button>
      <button id="reset" class="sec">เตรียมสนามใหม่</button>
    </div>
    <h3>ผลการแข่ง</h3>
    <ol id="results"></ol>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
$("names").value = Array.from({length:20},(_,i)=>"ผู้เข้าแข่งคนที่ "+(i+1)).join("\n");

const START = 190, FINISH = 930, MEDAL = ["🥇","🥈","🥉"];
let racers = [], running = false, order = [], prizes = 1, laneH = 30, H = 700;
const parse = () => $("names").value.split("\n").map(s=>s.trim()).filter(Boolean).slice(0,30);
function rnd(){ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0]/4294967296; }

function setup(){
  const names = parse();
  racers = names.map((n,i)=>({name:n,i,x:START,v:1,h:(i*137)%360,done:false}));
  order = []; $("results").innerHTML = "";
  laneH = Math.min(44, Math.floor(660/Math.max(1,racers.length)));
  H = Math.max(260, laneH*racers.length + 40);
  cv.height = H; draw();
  $("banner").className = "banner"; $("banner").textContent = `พร้อมแข่ง — ผู้เข้าแข่ง ${racers.length} คน`;
}

function draw(){
  ctx.clearRect(0,0,1000,H);
  const top = 20;
  racers.forEach((r,i)=>{
    const y = top + i*laneH;
    ctx.fillStyle = i%2 ? "#5da34a" : "#6db85a"; ctx.fillRect(0,y,1000,laneH);
    ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(0,y,START-10,laneH);
    ctx.fillStyle = "#fff"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.font = `${Math.max(11,laneH*0.5)}px "Noto Sans Thai",sans-serif`;
    let t = `${i+1}. ${r.name}`; while (t.length>20 && t.length) t = t.slice(0,-1);
    ctx.fillText(t.length < `${i+1}. ${r.name}`.length ? t+"…" : t, 8, y+laneH/2);
  });
  // start & finish lines
  ctx.fillStyle = "#fff"; ctx.fillRect(START-2,top,3,racers.length*laneH);
  for (let k=0;k<racers.length*2;k++){ ctx.fillStyle = k%2 ? "#000" : "#fff"; ctx.fillRect(FINISH, top+k*laneH/2, 10, laneH/2); ctx.fillStyle = k%2 ? "#fff" : "#000"; ctx.fillRect(FINISH+10, top+k*laneH/2, 10, laneH/2); }
  racers.forEach((r,i)=>{
    const y = top + i*laneH + laneH/2, s = Math.max(16,laneH*0.85);
    ctx.font = `${s}px sans-serif`; ctx.textAlign = "center";
    ctx.save(); ctx.translate(r.x, y); ctx.scale(-1, 1); ctx.fillText("🐎", 0, 0); ctx.restore();
    ctx.fillStyle = `hsl(${r.h},80%,45%)`; ctx.beginPath(); ctx.arc(r.x-s*0.55, y, Math.max(7,laneH*0.25), 0, 7); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = `bold ${Math.max(9,laneH*0.3)}px sans-serif`; ctx.fillText(i+1, r.x-s*0.55, y+1);
  });
}

function renderResults(){
  $("results").innerHTML = "";
  order.forEach((r,k)=>{ const li = document.createElement("li"); li.textContent = `${MEDAL[k]||"🏅"} อันดับ ${k+1}: ${r.name}`; $("results").appendChild(li); });
}

function tick(){
  if (!running) return;
  racers.forEach(r=>{
    if (r.done) return;
    r.v += (1.05 - r.v)*0.03 + (rnd()-0.5)*0.3;
    r.v = Math.max(0.35, Math.min(1.9, r.v));
    r.x += r.v;
  });
  const crossed = racers.filter(r=>!r.done && r.x >= FINISH).sort((a,b)=>b.x-a.x);
  crossed.forEach(r=>{
    r.done = true; r.x = FINISH; order.push(r); renderResults();
    if (order.length === 1){ $("banner").className = "banner win"; $("banner").textContent = `🏆 ${r.name} เข้าเส้นชัยก่อน!`; boom(); }
  });
  draw();
  if (order.length >= Math.min(prizes, racers.length)){
    running = false; $("go").disabled = false;
    $("banner").className = "banner win";
    $("banner").textContent = `🎉 ผู้โชคดี ${order.length} คน ได้แก่ ${order.map(o=>o.name).join(", ")}`;
    boom(); return;
  }
  requestAnimationFrame(tick);
}

$("go").addEventListener("click", async ()=>{
  if (running) return;
  setup(); if (racers.length < 2){ $("banner").textContent = "ต้องมีอย่างน้อย 2 คน"; return; }
  prizes = Math.max(1, parseInt($("prizes").value)||1);
  $("go").disabled = true;
  for (const t of ["3","2","1","GO! 🏁"]){ $("banner").className = "banner"; $("banner").textContent = t; await new Promise(r=>setTimeout(r, t==="GO! 🏁"?500:800)); }
  $("banner").textContent = "กำลังแข่ง...";
  running = true; requestAnimationFrame(tick);
});
$("reset").addEventListener("click", ()=>{ if(!running) setup(); });
$("names").addEventListener("input", ()=>{ if(!running) setup(); });

/* confetti */
const cf = $("confetti"), cx = cf.getContext("2d"); let parts = [], raf = 0;
function size(){ cf.width = innerWidth; cf.height = innerHeight; } size(); addEventListener("resize", size);
function boom(){
  for (let i=0;i<150;i++) parts.push({x:cf.width/2,y:cf.height/3,vx:(Math.random()-.5)*20,vy:-Math.random()*16-3,
    s:6+Math.random()*7,c:`hsl(${Math.random()*360},90%,60%)`,r:Math.random()*6,vr:(Math.random()-.5)*.4,life:130+Math.random()*50});
  if (!raf) raf = requestAnimationFrame(ctick);
}
function ctick(){
  cx.clearRect(0,0,cf.width,cf.height);
  parts = parts.filter(p => p.life-- > 0 && p.y < cf.height+20);
  parts.forEach(p => { p.vy += .42; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += p.vr;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); cx.restore(); });
  raf = parts.length ? requestAnimationFrame(ctick) : 0;
}
setup();
</script>
</body>
</html>
